name: obakit
description: The OneBusAway app as an embeddable Flutter SDK (the counterpart of iOS OBAKit) - application scope, theme, localization, navigation shell, map and screens.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.3
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  http: ^1.6.0
  intl: any
  latlong2: ^0.10.1
  oba_arrivals:
    path: ../oba_arrivals
  obakit_core:
    path: ../obakit_core
  obakit_trip_planner:
    path: ../obakit_trip_planner
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  generate: true
  assets:
    # The default regions list (ObaApplication.bundledRegionsAssetKey).
    # To refresh it, see "Refreshing the bundled regions list" in README.md.
    - assets/regions.json
