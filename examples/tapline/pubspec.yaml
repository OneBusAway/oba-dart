name: tapline_example
description: "Sample transit fare app (fictional Tapline brand) that embeds OneBusAway SDK experiences."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  obakit:
    path: ../../packages/obakit
  obakit_trip_planner:
    path: ../../packages/obakit_trip_planner
  # Vector map tiles (stage 2 prototype). A beta, pinned exactly; it is the
  # line that supports flutter_map 8.
  vector_map_tiles: 9.0.0-beta.13
  # For ThemeReader: the app recolours the vector style before rendering.
  vector_tile_renderer: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
